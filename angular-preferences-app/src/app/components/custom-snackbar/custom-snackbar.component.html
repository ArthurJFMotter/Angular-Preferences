<div
  class="snackbar-container"
  [ngClass]="data.type"
  [class.legacy-style]="data.useLegacyStyle"
  [class.force-hc-style]="data.forceHighContrast"
>
  <div class="icon-area">
    <mat-icon>{{ getIcon() }}</mat-icon>
  </div>

  <div class="content-area">
    <span class="message">{{ data.message }}</span>
  </div>

  <div class="action-area">
    <app-snackbar-action
      [action]="data.action"
      [forceHighContrast]="data.forceHighContrast || false"
      (actionClick)="handleAction()"
      (dismiss)="handleDismiss()"
    >
    </app-snackbar-action>
  </div>
</div>
