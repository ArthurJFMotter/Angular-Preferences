<div class="fab-container">
  <button mat-fab color="primary" [matMenuTriggerFor]="mainMenu" aria-label="Quick Settings">
    <mat-icon>tune</mat-icon>
  </button>
</div>

<!-- MAIN MENU (Dynamically protected by Domain Gates!) -->
<mat-menu #mainMenu="matMenu" yPosition="above" xPosition="before" class="quick-settings-menu">
  
  @if (prefs.hasColor) {
    <button mat-menu-item [matMenuTriggerFor]="colorMenu.menu"><mat-icon>palette</mat-icon> Theme & Color</button>
    <app-fab-color-menu #colorMenu></app-fab-color-menu>
  }
  
  @if (prefs.hasTypography) {
    <button mat-menu-item [matMenuTriggerFor]="typeMenu.menu"><mat-icon>text_fields</mat-icon> Typography</button>
    <app-fab-typography-menu #typeMenu></app-fab-typography-menu>
  }

  @if (prefs.hasLayout) {
    <button mat-menu-item [matMenuTriggerFor]="layoutMenu.menu"><mat-icon>dashboard</mat-icon> Layout & Scaling</button>
    <app-fab-layout-menu #layoutMenu></app-fab-layout-menu>
  }

  @if (prefs.hasNotifications) {
    <button mat-menu-item [matMenuTriggerFor]="notifMenu.menu"><mat-icon>notifications</mat-icon> Notifications</button>
    <app-fab-notifications-menu #notifMenu></app-fab-notifications-menu>
  }

  @if (prefs.hasAccessibility) {
    <button mat-menu-item [matMenuTriggerFor]="accessMenu.menu"><mat-icon>visibility</mat-icon> Vision Simulator</button>
    <app-fab-accessibility-menu #accessMenu></app-fab-accessibility-menu>
  }

</mat-menu>
