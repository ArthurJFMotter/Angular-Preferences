<div class="fab-container">
  <button mat-fab color="primary" [matMenuTriggerFor]="mainMenu" aria-label="Quick Settings">
    <mat-icon>tune</mat-icon>
  </button>
</div>

<!-- MAIN MENU -->
<mat-menu #mainMenu="matMenu" yPosition="above" xPosition="before" class="quick-settings-menu">
  
  @if (prefs.hasColor) {
    <button mat-menu-item [matMenuTriggerFor]="colorMenu">
      <mat-icon>palette</mat-icon> Theme & Color
    </button>
  }
  
  @if (prefs.hasTypography || prefs.hasLayout) {
    <button mat-menu-item [matMenuTriggerFor]="layoutMenu">
      <mat-icon>dashboard</mat-icon> Interface Scaling
    </button>
  }

  @if (prefs.hasAccessibility) {
    <button mat-menu-item [matMenuTriggerFor]="visionMenu">
      <mat-icon>visibility</mat-icon> Vision Simulator
    </button>
  }
</mat-menu>

<!-- SUBMENU: COLOR -->
<mat-menu #colorMenu="matMenu">
  <button mat-menu-item (click)="prefs.setMode('light')"><mat-icon>light_mode</mat-icon> Light Mode</button>
  <button mat-menu-item (click)="prefs.setMode('dark')"><mat-icon>dark_mode</mat-icon> Dark Mode</button>
  <button mat-menu-item (click)="prefs.setMode('auto')"><mat-icon>brightness_auto</mat-icon> System Auto</button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="prefs.setContrastLevel(0)"><mat-icon>tonality</mat-icon> Standard Contrast</button>
  <button mat-menu-item (click)="prefs.setContrastLevel(1)"><mat-icon>contrast</mat-icon> High Contrast</button>
</mat-menu>

<!-- SUBMENU: LAYOUT & TYPOGRAPHY -->
<mat-menu #layoutMenu="matMenu">
  @if (prefs.hasTypography) {
    <button mat-menu-item (click)="prefs.setFontScale(0.85)"><mat-icon>text_decrease</mat-icon> Small Text</button>
    <button mat-menu-item (click)="prefs.setFontScale(1)"><mat-icon>format_size</mat-icon> Standard Text</button>
    <button mat-menu-item (click)="prefs.setFontScale(1.15)"><mat-icon>text_increase</mat-icon> Large Text</button>
    <mat-divider></mat-divider>
  }
  @if (prefs.hasLayout) {
    <button mat-menu-item (click)="prefs.setDensityScale(0)"><mat-icon>view_headline</mat-icon> Comfort Density</button>
    <button mat-menu-item (click)="prefs.setDensityScale(-3)"><mat-icon>compress</mat-icon> Compact Density</button>
  }
</mat-menu>

<!-- SUBMENU: VISION SIMULATOR -->
<mat-menu #visionMenu="matMenu">
  <button mat-menu-item (click)="prefs.setCvdMode('none')"><mat-icon>visibility</mat-icon> Normal Vision</button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="prefs.setCvdMode('protanopia'); prefs.setCvdSeverity(100)"><mat-icon>color_lens</mat-icon> Protanopia</button>
  <button mat-menu-item (click)="prefs.setCvdMode('deuteranopia'); prefs.setCvdSeverity(100)"><mat-icon>color_lens</mat-icon> Deuteranopia</button>
  <button mat-menu-item (click)="prefs.setCvdMode('achromatopsia'); prefs.setCvdSeverity(100)"><mat-icon>gradient</mat-icon> Achromatopsia</button>
</mat-menu>
