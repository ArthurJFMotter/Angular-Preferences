<mat-menu #menu="matMenu" class="cycle-menu">
  <button mat-menu-item (click)="cycleProfile($event)">
    <mat-icon [style.color]="activeColor()">{{
      prefs.scheme() === "custom" ? "tune" : "palette"
    }}</mat-icon>
    <span class="label">Color Profile</span>
    <span class="value">{{ profileName() }}</span>
  </button>

  <button mat-menu-item (click)="cycleMode($event)">
    <mat-icon>brightness_6</mat-icon>
    <span class="label">Theme Mode</span>
    <span class="value">{{ prefs.mode() | titlecase }}</span>
  </button>

  <button mat-menu-item (click)="cycleVariant($event)">
    <mat-icon>category</mat-icon>
    <span class="label">Theme Variant</span>
    <span class="value">{{ variantName() }}</span>
  </button>

  <button mat-menu-item (click)="cycleContrast($event)">
    <mat-icon>contrast</mat-icon>
    <span class="label">Contrast</span>
    <span class="value">{{ contrastName() }}</span>
  </button>
</mat-menu>
