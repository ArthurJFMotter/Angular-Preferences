<mat-menu #menu="matMenu" class="cycle-menu">
  <button mat-menu-item [matMenuTriggerFor]="profileMenu">
    <mat-icon>color_lens</mat-icon> <span class="label">Color Profile</span>
    <span class="value">{{ profileName() }}</span>
  </button>
  <button mat-menu-item (click)="cycleMode($event)">
    <mat-icon>brightness_6</mat-icon> <span class="label">Theme Mode</span>
    <span class="value">{{ prefs.mode() | titlecase }}</span>
  </button>
  <button mat-menu-item (click)="cycleVariant($event)">
    <mat-icon>category</mat-icon> <span class="label">Theme Variant</span>
    <span class="value">{{ variantName() }}</span>
  </button>
  <button mat-menu-item (click)="cycleContrast($event)">
    <mat-icon>contrast</mat-icon> <span class="label">Contrast</span>
    <span class="value">{{ contrastName() }}</span>
  </button>
</mat-menu>

<!-- Submenus -->
<mat-menu #profileMenu="matMenu">
  @for (profile of prefs.savedProfiles(); track profile.id) {
    <button mat-menu-item (click)="prefs.setScheme(profile.id)">
      <mat-icon [style.color]="profile.colors.primary">{{
        prefs.scheme() === profile.id ? "check_circle" : "circle"
      }}</mat-icon>
      {{ profile.name }}
    </button>
  }
  @if (prefs.savedProfiles().length > 0) {
    <mat-divider></mat-divider>
  }
  <button mat-menu-item (click)="prefs.setScheme('custom')">
    <mat-icon [style.color]="prefs.customColors().primary">{{
      prefs.scheme() === "custom" ? "check_circle" : "circle"
    }}</mat-icon>
    Custom Scratchpad
  </button>
</mat-menu>
