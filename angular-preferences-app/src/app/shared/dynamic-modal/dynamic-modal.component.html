<div class="dynamic-modal-container">
  <!-- Header -->
  <h2 mat-dialog-title>
    @if (data.icon) {
      <mat-icon>{{ data.icon }}</mat-icon>
    }
    {{ data.title }}
  </h2>

  <!-- Content -->
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions align="end">
    @if (data.showCloseButton !== false) {
      <button mat-button mat-dialog-close>Close</button>
    }
    
    @for (action of data.actions; track action.label) {
      
      <!-- Primary Action -->
      @if (action.isPrimary) {
        <button 
          mat-flat-button 
          [color]="action.color || 'primary'"
          (click)="handleAction(action)">
          {{ action.label }}
        </button>
      } 
      <!-- Secondary Action -->
      @else {
        <button 
          mat-button 
          [color]="action.color || 'primary'"
          (click)="handleAction(action)">
          {{ action.label }}
        </button>
      }
      
    }
  </mat-dialog-actions>
</div>
