<mat-toolbar class="app-navbar">
  
  <!-- Left-side Settings Drawer -->
  @if (uiState.widgetMode() === "drawer" && uiState.drawerConfig().position === "start") {
    <button mat-icon-button (click)="drawer.toggle()" class="drawer-trigger start" aria-label="Open Settings">
      <mat-icon>menu</mat-icon>
    </button>
  }

  <div class="brand" routerLink="/">
    <mat-icon color="primary">palette</mat-icon>
    <h1>User Preferences</h1>
  </div>

  <span class="toolbar-spacer"></span>

  <div class="nav-actions">
    <!-- Desktop Navigation -->
    <div class="desktop-nav">
      <a mat-button routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </a>
      <a mat-button routerLink="/configurations" routerLinkActive="active-link">
        <mat-icon>settings</mat-icon>
        <span>Configurations</span>
      </a>
    </div>

    <!-- Mobile Overflow Navigation -->
    <div class="mobile-nav">
      <button mat-icon-button [matMenuTriggerFor]="mobileMenu" aria-label="Open Navigation">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #mobileMenu="matMenu">
        <a mat-menu-item routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
          <mat-icon>home</mat-icon>
          <span>Home</span>
        </a>
        <a mat-menu-item routerLink="/configurations" routerLinkActive="active-link">
          <mat-icon>settings</mat-icon>
          <span>Configurations</span>
        </a>
      </mat-menu>
    </div>

    <!-- Right-side Settings Drawer -->
    @if (uiState.widgetMode() === "drawer" && uiState.drawerConfig().position === "end") {
      <button mat-icon-button (click)="drawer.toggle()" class="drawer-trigger end" aria-label="Open Settings">
        <mat-icon>menu</mat-icon>
      </button>
    }
  </div>
</mat-toolbar>
