<app-settings-card-wrapper
  icon="notifications_active"
  headerTitle="Notifications"
  helpMessage="Control where alerts appear on screen and adjust their contrast levels for better visibility."
>
    <!-- Position Control -->
    <div class="control-group">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Screen Position</mat-label>
        <mat-select
          [value]="themeService.notificationPlacement()"
          (selectionChange)="
            preferencesService.setNotificationPlacement($event.value)
          "
        >
          @for (option of placementOptions; track option.value) {
            <mat-option [value]="option.value">
              {{ option.label }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Personalization Styles -->
    <div class="control-group">
      <span id="checkbox-label" class="group-label">Personalization</span>
      <!-- Legacy -->
      <div aria-labelledby="checkbox-label" class="checkbox-group">
        <mat-checkbox
          color="primary"
          [checked]="themeService.useLegacyNotifications()"
          (change)="preferencesService.toggleLegacyNotifications()"
        >
          Use Classic Colors
        </mat-checkbox>
        <p class="hint">Uses traditional status colors (Green, yellow, Red).</p>
      </div>
      <div aria-labelledby="checkbox-label" class="checkbox-group">
        <!-- Force High Contrast -->
        <mat-checkbox
          color="primary"
          [checked]="themeService.forceHighContrastNotifications()"
          (change)="preferencesService.toggleForceHighContrastNotifications()"
        >
          Use Extra Contrast
        </mat-checkbox>
        <p class="hint">
          Enforces an black and white scheme for maximum readability.
        </p>
      </div>
    </div>
</app-settings-card-wrapper>
