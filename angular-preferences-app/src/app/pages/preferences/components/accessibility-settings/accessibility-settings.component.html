<app-settings-card-wrapper
  icon="accessibility_new"
  title="Accessibility"
  helpMessage="Tools to improve visibility and usability for users with visual or motor impairments."
>
  <!-- High Contrast Mode -->
  <div class="control-group">
    <label id="contrast-label" class="group-label">Contrast Mode</label>
    <mat-button-toggle-group
      class="button-toggle-group"
      aria-labelledby="contrast-label"
      [value]="preferencesService.contrastMode()"
      (change)="preferencesService.setContrastMode($event.value)"
    >
      <mat-button-toggle value="normal">
        <mat-icon>invert_colors_off</mat-icon> <span>Standard</span>
      </mat-button-toggle>
      <mat-button-toggle value="auto">
        <mat-icon>hdr_auto</mat-icon> <span>Auto</span>
      </mat-button-toggle>
      <mat-button-toggle value="high">
        <mat-icon>invert_colors</mat-icon> <span>High</span>
      </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <!-- Color Vision -->
  <div class="control-group">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Color Vision Deficiency</mat-label>
      <mat-select
        [value]="themeService.activeColorFilter()"
        (selectionChange)="preferencesService.setColorFilter($event.value)"
      >
        @for (filter of themeService.getDaltonicFilters(); track filter.id) {
          <mat-option [value]="filter.id">{{ filter.displayName }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Toggles Row -->
  <div class="toggle-column">
    <!-- Mini Helper -->
    <mat-slide-toggle
      color="primary"
      [checked]="preferencesService.showHelper()"
      (change)="preferencesService.toggleHelper()"
    >
      Floating Helper
    </mat-slide-toggle>

    <!-- Help tooltip-->
    <mat-slide-toggle
      color="primary"
      [checked]="preferencesService.showTooltips()"
      (change)="preferencesService.toggleTooltips()"
    >
      Show Explanations
    </mat-slide-toggle>

    <!-- Reduced Motion -->
    <mat-slide-toggle
      color="primary"
      [checked]="themeService.isReducedMotion()"
      (change)="preferencesService.toggleReducedMotion()"
    >
      Reduce Motion
    </mat-slide-toggle>
  </div>
</app-settings-card-wrapper>
