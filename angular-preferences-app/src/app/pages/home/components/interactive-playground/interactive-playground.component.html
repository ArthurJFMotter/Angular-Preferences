<div class="playground-card">
  <!-- Window Header -->
  <div class="editor-header">
    <div class="window-controls">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <span class="filename">app.config.ts</span>
  </div>

  <!-- Code Content -->
  <div class="editor-content">
    <pre><code>{{ codeSnippet() }}</code></pre>

    <div class="powered-badge">
      <mat-icon class="bolt-icon">bolt</mat-icon>
      <span>Signals</span>
    </div>
  </div>

  <!-- Playground Controls -->
  <div class="playground-controls">
    <!-- Theme Mode -->
    <button
      class="mini-toggle"
      (click)="cycleThemeMode()"
      matTooltip="Theme Mode: {{ preferencesService.themeMode() | titlecase }}"
    >
      <mat-icon>
        {{
          preferencesService.themeMode() === "auto"
            ? "brightness_auto"
            : preferencesService.themeMode() === "dark"
              ? "dark_mode"
              : "light_mode"
        }}
      </mat-icon>
      <span class="toggle-text">{{ preferencesService.themeMode() | titlecase }}</span>
    </button>

    <!-- Contrast Mode -->
    <button
      class="mini-toggle"
      (click)="cycleContrastMode()"
      matTooltip="Contrast: {{ preferencesService.contrastMode() | titlecase }}"
    >
      <mat-icon>contrast</mat-icon>
      <span class="toggle-text">
        {{
          preferencesService.contrastMode() === "auto"
            ? "Auto"
            : preferencesService.contrastMode() === "high"
              ? "High"
              : "Normal"
        }}
      </span>
    </button>

    <!-- Border Radius -->
    <button
      class="mini-toggle"
      (click)="cycleShape()"
      matTooltip="Border Radius"
    >
      <mat-icon>rounded_corner</mat-icon>
      <span class="toggle-text">
        {{ shapeService.activeShape().displayName.split(" ")[0] }}
      </span>
    </button>

    <!-- Font Size -->
    <button
      class="mini-toggle"
      (click)="cycleFontSize()"
      matTooltip="Font Size"
    >
      <mat-icon>format_size</mat-icon>
      <span class="toggle-text">
        {{ typographyService.activeFontSize().displayName }}
      </span>
    </button>
  </div>
</div>
