<section class="carousel-container">
  <!-- Navigation / Tabs -->
  <div class="steps-nav">
    <div
      *ngFor="let step of steps; let i = index"
      class="step-tab"
      [class.active]="i === currentStepIndex"
      (click)="setStep(i)"
      (mouseenter)="onPause()"
      (mouseleave)="onResume()"
      tabindex="0"
      (keydown.enter)="setStep(i)"
    >
      <div class="step-header">
        <span class="step-number">{{ i + 1 }}</span>
        <h3>{{ step.title }}</h3>
      </div>

      <p class="step-desc">{{ step.description }}</p>

      <!-- Progress Bar -->
      <div class="progress-track">
        <mat-progress-bar 
          mode="determinate" 
          [value]="i === currentStepIndex ? progress : 0">
        </mat-progress-bar>
      </div>
    </div>
  </div>

  <!-- Visual Display Window -->
  <div
    class="display-window"
    (mouseenter)="onPause()"
    (mouseleave)="onResume()"
  >
    <!-- Slide 1: Configure Visual -->
    <div class="slide-content" [class.active]="currentStepIndex === 0">
      <div class="mock-ui sidebar-mock">
        <div class="mock-group">
          <div class="mock-row" style="width: 40%"></div>
          <div class="mock-row"></div>
        </div>
        <div class="mock-group">
          <div class="mock-row" style="width: 30%"></div>
          <div class="mock-slider-track"></div>
        </div>
        <div class="mock-group">
          <div class="mock-row" style="width: 50%"></div>
          <div class="mock-slider-track"></div>
        </div>
        <span class="mock-label">Adjusting Theme...</span>
      </div>
    </div>

    <!-- Slide 2: Preview Visual -->
    <div class="slide-content" [class.active]="currentStepIndex === 1">
      <div class="mock-ui card-mock">
        <div class="preview-card">
          <div class="mock-img"></div>
          <div class="mock-text-lines">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <span class="mock-label">Live Preview</span>
      </div>
    </div>

    <!-- Slide 3: Integrate Visual -->
    <div class="slide-content" [class.active]="currentStepIndex === 2">
      <div class="mock-ui code-mock">
        <div class="code-window">
          <div class="code-line">
            <span class="keyword">const </span>
            <span class="property">userConfig</span> = &#123;
          </div>
          <div class="code-line indent">
            <span class="property">theme</span>:
            <span class="string">'dark'</span>,
          </div>
          <div class="code-line indent">
            <span class="property">contrast</span>:
            <span class="string">'high'</span>,
          </div>
          <div class="code-line indent">
            <span class="property">density</span>:
            <span class="string">'compact'</span>,
          </div>
          <div class="code-line indent">
            <span class="property">borderRadius</span>:
            <span class="string">'medium'</span>
          </div>
          <div class="code-line">&#125;;</div>
        </div>

        <span class="mock-label">Generated Config</span>
      </div>
    </div>
  </div>
</section>
