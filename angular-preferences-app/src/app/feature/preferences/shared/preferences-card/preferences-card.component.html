<mat-card appearance="outlined" class="pref-card">
  <mat-card-header>
    <mat-icon mat-card-avatar color="primary">{{ icon }}</mat-icon>
    <mat-card-title>{{ title }}</mat-card-title>
    <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
