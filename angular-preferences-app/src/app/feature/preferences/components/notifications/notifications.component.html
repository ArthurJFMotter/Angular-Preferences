<app-preferences-card
  title="Notifications"
  subtitle="Alert positioning and semantics"
  icon="notifications"
>
  <!-- POSITION DROPDOWNS -->
  <div class="field-group row-group">
    
    <div class="flex-field">
      <app-preference-select
        label="Vertical Spawn"
        [value]="prefs.snackbarVPosition()"
        [options]="vPositions"
        (valueChange)="updateVPosition($event)">
      </app-preference-select>
    </div>

    <div class="flex-field">
      <app-preference-select
        label="Horizontal Spawn"
        [value]="prefs.snackbarHPosition()"
        [options]="hPositions"
        (valueChange)="updateHPosition($event)">
      </app-preference-select>
    </div>
    
  </div>

  <mat-divider></mat-divider>

  <!-- PREVIEW BUTTONS -->
  <div class="field-group">
    <label>Preview Semantic Alerts</label>
    <div class="preview-buttons">
      <button mat-stroked-button (click)="testAlert('default')">Default</button>
      <button mat-flat-button class="btn-success" (click)="testAlert('success')">Success</button>
      <button mat-flat-button class="btn-warning" (click)="testAlert('warning')">Warning</button>
      <button mat-flat-button class="btn-info" (click)="testAlert('info')">Info</button>
      <button mat-flat-button class="btn-error" (click)="testAlert('error')">Error</button>
    </div>
  </div>
</app-preferences-card>
