<app-preferences-card
  title="Interface"
  subtitle="Shapes, density, and motion"
  icon="dashboard"
>
  <app-preference-slider 
    label="Corner Radius:" 
    [value]="prefs.shapeScale()" 
    [scale]="shapeScale" 
    [displayValue]="(prefs.shapeScale() * 100).toFixed(0) + '%'"
    (valueChange)="prefs.setShapeScale($event)">
  </app-preference-slider>

  <mat-divider></mat-divider>

  <app-preference-slider 
    label="Density:" 
    [value]="prefs.densityScale()" 
    [scale]="densityScale" 
    [displayValue]="prefs.densityScale().toString()"
    (valueChange)="prefs.setDensityScale($event)">
  </app-preference-slider>

  <mat-divider></mat-divider>

  <app-preference-slider 
    label="Motion:" 
    [value]="prefs.motionScale()" 
    [scale]="motionScale" 
    [displayValue]="motionName()"
    [highlight]="true"
    (valueChange)="prefs.setMotionScale($event)">
  </app-preference-slider>

  <mat-divider></mat-divider>

  <!-- WIDGET SELECTOR -->
  <div class="settings-row">
    <div class="settings-info">
      <label>Quick Access Widget</label>
      <p>Choose how to access preferences across the app.</p>
    </div>

    <div class="settings-actions" style="flex-direction: column; align-items: flex-end; gap: 8px;">
      
      <mat-button-toggle-group 
        color="primary" 
        [value]="uiState.widgetMode()" 
        (change)="uiState.widgetMode.set($event.value)">
        <mat-button-toggle value="fab" matTooltip="Floating Button"><mat-icon>add_circle</mat-icon></mat-button-toggle>
        <mat-button-toggle value="drawer" matTooltip="Side Drawer"><mat-icon>vertical_split</mat-icon></mat-button-toggle>
        <mat-button-toggle value="none" matTooltip="Hidden"><mat-icon>visibility_off</mat-icon></mat-button-toggle>
      </mat-button-toggle-group>

      @if (uiState.widgetMode() === 'fab') {
        <button mat-button color="primary" (click)="openFabSettings()" style="margin-right: -8px;">
          <mat-icon>tune</mat-icon> Customize FAB
        </button>
      }
    </div>
  </div>
</app-preferences-card>
