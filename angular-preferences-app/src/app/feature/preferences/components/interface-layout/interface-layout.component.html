<app-preferences-card
  title="Interface"
  subtitle="Shapes, density, and motion"
  icon="dashboard"
>
  <div class="slider-group">
    <div class="slider-header">
      <label>Corner Radius</label
      ><span>{{ prefs.shapeScale() | percent }}</span>
    </div>
    <div class="slider-row">
      <button mat-icon-button (click)="scaleShapeDown()">
        <mat-icon>remove</mat-icon>
      </button>
      <mat-slider min="0" max="3" step="0.25" discrete
        ><input
          matSliderThumb
          [ngModel]="prefs.shapeScale()"
          (ngModelChange)="prefs.setShapeScale($event)"
      /></mat-slider>
      <button mat-icon-button (click)="scaleShapeUp()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>

  <mat-divider></mat-divider>

  <div class="slider-group">
    <div class="slider-header">
      <label>Density</label><span>{{ prefs.densityScale() }}</span>
    </div>
    <div class="slider-row">
      <button mat-icon-button (click)="scaleDensityDown()">
        <mat-icon>remove</mat-icon>
      </button>
      <mat-slider min="-3" max="0" step="1" discrete
        ><input
          matSliderThumb
          [ngModel]="prefs.densityScale()"
          (ngModelChange)="prefs.setDensityScale($event)"
      /></mat-slider>
      <button mat-icon-button (click)="scaleDensityUp()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>

  <mat-divider></mat-divider>

  <div class="slider-group">
    <div class="slider-header">
      <label>Motion</label
      ><span class="highlight">{{ formatMotion(prefs.motionScale()) }}</span>
    </div>
    <div class="slider-row">
      <button mat-icon-button (click)="decreaseMotion()">
        <mat-icon>remove</mat-icon>
      </button>
      <mat-slider min="0" max="1" step="0.5" discrete
        ><input
          matSliderThumb
          [ngModel]="prefs.motionScale()"
          (ngModelChange)="prefs.setMotionScale($event)"
      /></mat-slider>
      <button mat-icon-button (click)="increaseMotion()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>
</app-preferences-card>
