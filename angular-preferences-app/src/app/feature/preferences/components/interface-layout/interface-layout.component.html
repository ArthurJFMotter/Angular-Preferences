<app-preferences-card
  title="Interface"
  subtitle="Shapes, density, and motion"
  icon="dashboard"
>
  <app-preference-slider 
    label="Corner Radius:" 
    [value]="prefs.shapeScale()" 
    [scale]="shapeScale" 
    [displayValue]="(prefs.shapeScale() * 100).toFixed(0) + '%'"
    (valueChange)="prefs.setShapeScale($event)">
  </app-preference-slider>

  <mat-divider></mat-divider>

  <app-preference-slider 
    label="Density:" 
    [value]="prefs.densityScale()" 
    [scale]="densityScale" 
    [displayValue]="prefs.densityScale().toString()"
    (valueChange)="prefs.setDensityScale($event)">
  </app-preference-slider>

  <mat-divider></mat-divider>

  <app-preference-slider 
    label="Motion:" 
    [value]="prefs.motionScale()" 
    [scale]="motionScale" 
    [displayValue]="motionName()"
    [highlight]="true"
    (valueChange)="prefs.setMotionScale($event)">
  </app-preference-slider>

  <mat-divider></mat-divider>

  <!-- QUICK SETTINGS FAB CONTROLS -->
  <div class="settings-row">
    <div class="settings-info">
      <label>Quick Settings FAB</label>
      <p>Enable a floating menu for instant access to your favorite domains.</p>
    </div>

    <div class="settings-actions">
      @if (uiState.showQuickFab()) {
        <button mat-stroked-button color="primary" (click)="openFabSettings()">
          <mat-icon>tune</mat-icon> Customize
        </button>
      }

      <mat-slide-toggle
        color="primary"
        [checked]="uiState.showQuickFab()"
        (change)="uiState.showQuickFab.set($event.checked)"
        aria-label="Toggle Quick Settings FAB"
      >
      </mat-slide-toggle>
    </div>
  </div>
</app-preferences-card>
