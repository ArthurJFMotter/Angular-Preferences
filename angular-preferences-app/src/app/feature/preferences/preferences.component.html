<div class="preferences-page">
  <header class="page-header">
    <h1>Global Preferences</h1>
    <p>Configure your workspace. Changes are saved automatically and applied instantly.</p>
  </header>

  <div class="cards-grid">
    @if (prefs.hasColor) { <app-color-appearance/> }
    @if (prefs.hasTypography) { <app-typography/> }
    @if (prefs.hasLayout) { <app-interface-layout/> }
    @if (prefs.hasNotifications) { <app-notifications/> }
    @if (prefs.hasAccessibility) { <app-vision-filters/> }
  </div>

  <div class="page-footer">
    <button mat-stroked-button color="warn" (click)="prefs.resetToDefaults()">
      <mat-icon>restore</mat-icon> Reset All Preferences
    </button>
  </div>
</div>
